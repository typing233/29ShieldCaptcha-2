services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shieldcaptcha
      POSTGRES_USER: captcha
      POSTGRES_PASSWORD: ${PG_PASSWORD:-captcha_dev_pass}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captcha -d shieldcaptcha"]
      interval: 10s
      timeout: 3s
      retries: 3

  shieldcaptcha:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CAPTCHA_HMAC_SECRET=${CAPTCHA_HMAC_SECRET:-}
      - CAPTCHA_PORT=8080
      - CAPTCHA_BASE_DIFFICULTY=18
      - CAPTCHA_MIN_DIFFICULTY=16
      - CAPTCHA_MAX_DIFFICULTY=24
      - CAPTCHA_CHALLENGE_TTL=120s
      - CAPTCHA_RATE_LIMIT=10
      - CAPTCHA_RATE_BURST=20
      - CAPTCHA_NONCE_EXPIRY=300s
      - CAPTCHA_LOG_LEVEL=info
      - CAPTCHA_ENABLE_REDIS=true
      - CAPTCHA_REDIS_URL=redis://redis:6379/0
      - CAPTCHA_ENABLE_POSTGRES=true
      - CAPTCHA_POSTGRES_URL=postgres://captcha:${PG_PASSWORD:-captcha_dev_pass}@postgres:5432/shieldcaptcha?sslmode=disable
      - CAPTCHA_AUTO_MIGRATE=true
      - CAPTCHA_ADMIN_ENABLED=true
      - CAPTCHA_ADMIN_USER=${ADMIN_USER:-admin}
      - CAPTCHA_ADMIN_PASS=${ADMIN_PASS:-admin123}
      - CAPTCHA_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CAPTCHA_METRICS_ENABLED=true
      - CAPTCHA_FEATURE_RISK_ENGINE=true
      - CAPTCHA_FEATURE_BEHAVIOR=true
      - CAPTCHA_FEATURE_ADAPTIVE_RATE=true
      - CAPTCHA_FEATURE_REPLAY_DETECT=true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    depends_on:
      - shieldcaptcha

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin123}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  redis-data:
  pg-data:
  prom-data:
  grafana-data:
